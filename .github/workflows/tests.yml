name: Checks
on:
  push:
  pull_request:

# Superseded integration commits are not worth running to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Pin before the Ubuntu 26 migration: its new apt-mirror setup caused
    # external DNS failures in the pinned geographic import and browser CI.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/ekiti_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run test:all
      - name: Create isolated geographic database
        run: |
          psql postgres://postgres:ci@localhost:5432/postgres -c 'CREATE DATABASE ekiti_test TEMPLATE template0'
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f db/migrations/0001_geography.sql -f db/migrations/0002_location.sql -f db/migrations/0003_location_directory.sql -f db/seeds/0001_ekiti_lgas.sql
      - name: Import and verify the pinned INEC directory
        run: |
          # Use pinned, table-aware Python extraction: avoid flaky Ubuntu apt mirror.
          # Import still rejects changed PDF SHA, wrong parent LGA or !=177 ward rows.
          python3 -m pip install --disable-pip-version-check --no-input pdfplumber==0.11.10
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            https://inecnigeria.org/documents/resources/rac/EKITI.pdf -o "$RUNNER_TEMP/ekiti.pdf"
          python3 scripts/import_geo.py --inec-pdf "$RUNNER_TEMP/ekiti.pdf"
          python3 scripts/import_geo.py --inec-pdf "$RUNNER_TEMP/ekiti.pdf"
          python3 tests/import_checks.py
      - name: Install knowledge and directory schema in disposable CI database
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f db/migrations/0004_knowledge_directory.sql
      - name: Verify reviewed-content isolation and public reader functions
        run: node --experimental-strip-types --test tests/knowledge-postgis.mjs
      - name: Prepare disposable Supabase Auth roles (CI only)
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/bootstrap-citizen-auth.sql
      - name: Apply gated citizen moderation proposal to disposable CI database
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/install-citizen-proposal.sql
      - name: Verify signed-in reviews, claims and privacy gates
        run: node --experimental-strip-types --test tests/citizen-postgis.mjs
      - name: Apply private reporting proposals in disposable CI database only
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -c "SET SESSION ekiti.report_policy_approved='yes'; SET SESSION ekiti.private_gateway_reviewed='yes';" \
            -f db/proposals/0004_reporting_private.sql \
            -c 'BEGIN' \
            -f db/proposals/0006_private_gateway.sql \
            -c 'COMMIT'
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "CREATE ROLE report_ci LOGIN PASSWORD 'ci'; GRANT ekiti_report_api TO report_ci"
      - name: Test the real private gateway transaction and RLS on disposable PostGIS
        run: node --experimental-strip-types --test tests/private-report-postgis.mjs
      - name: Verify citizen receipt-to-account SQL under disposable PostGIS and Auth roles
        run: node --experimental-strip-types --test tests/citizen-report-links-postgis.mjs
      - name: Verify Sprint 10 one-time case-message delivery and redemption in disposable PostGIS
        run: node --experimental-strip-types --test tests/case-link-delivery-postgis.mjs
      - name: Verify Sprint 11 scoped case timelines and consent in disposable PostGIS
        run: node --experimental-strip-types --test tests/case-timeline-postgis.mjs
      - run: npm run test:postgis
      - run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/coverage.sql

      - name: Test the browser against the Worker and PostGIS reader
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://location_browser:ci@127.0.0.1:5432/ekiti_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE location_browser LOGIN PASSWORD 'ci'; GRANT ekiti_location_reader TO location_browser"
          npm run staging:check
          npx playwright install chromium
          npm run test:browser

      - name: Preserve Sprint 02 centered homepage and conversation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-02-mobile-visual-review
          path: test-results/sprint-02-review/
          if-no-files-found: ignore
          retention-days: 5

      - name: Preserve Sprint 01 refinement screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-01-refinement-review
          path: test-results/sprint-01-refinement/
          if-no-files-found: ignore
          retention-days: 5

      - name: Preserve Sprint 01 welcome-screen visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-01-welcome-screens
          path: test-results/sprint-01-welcome/
          if-no-files-found: ignore
          retention-days: 5

      - name: Preserve guided civic journey mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civic-guided-journeys-review
          path: test-results/citizen-journeys/
          if-no-files-found: ignore
          retention-days: 5

      - name: Preserve rendered citizen chat screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citizen-chat-visual-review
          path: test-results/citizen-chat/
          if-no-files-found: ignore
          retention-days: 5
