name: Checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/ekiti_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run test:all
      - name: Create isolated geographic database
        run: |
          psql postgres://postgres:ci@localhost:5432/postgres -c 'CREATE DATABASE ekiti_test TEMPLATE template0'
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f db/migrations/0001_geography.sql -f db/migrations/0002_location.sql -f db/migrations/0003_location_directory.sql -f db/seeds/0001_ekiti_lgas.sql
      - name: Import and verify the pinned INEC directory
        run: |
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            https://inecnigeria.org/documents/resources/rac/EKITI.pdf -o "$RUNNER_TEMP/ekiti.pdf"
          python3 scripts/import_geo.py --inec-pdf "$RUNNER_TEMP/ekiti.pdf"
          python3 scripts/import_geo.py --inec-pdf "$RUNNER_TEMP/ekiti.pdf"
          python3 tests/import_checks.py
      - name: Install knowledge and directory schema in disposable CI database
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f db/migrations/0004_knowledge_directory.sql
      - name: Verify reviewed-content isolation and public reader functions
        run: node --experimental-strip-types --test tests/knowledge-postgis.mjs
      - name: Prepare disposable Supabase Auth roles (CI only)
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/bootstrap-citizen-auth.sql
      - name: Apply gated citizen moderation proposal to disposable CI database
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/install-citizen-proposal.sql
      - name: Verify signed-in reviews, claims and privacy gates
        run: node --experimental-strip-types --test tests/citizen-postgis.mjs
      - run: npm run test:postgis
      - run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/coverage.sql

      - name: Verify admin proposal refuses unapproved execution
        run: |
          ! psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f db/proposals/0006_admin_private.sql
      - name: Apply private proposals to disposable CI database ONLY
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/install-admin-proposals.sql
      - name: Verify private administrative RLS and denied roles
        run: node --experimental-strip-types --test tests/admin-private-postgis.mjs

      - name: Verify repository SQL refuses unauthorized installation
        run: |
          ! psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f db/proposals/0007_admin_repository.sql
      - name: Install private repository RPCs in DISPOSABLE CI database ONLY
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/install-admin-repository.sql
      - name: Test real PostgreSQL scoped admin queries and atomic audit/notes
        run: node --experimental-strip-types --test tests/admin-repository-postgis.mjs
      - name: Verify Sprint 12 two-person staff approval and revocation on disposable PostGIS
        run: node --experimental-strip-types --test tests/admin-staff-lifecycle-postgis.mjs

      - name: Build isolated administrative demo
        run: npm run build:admin

      - name: Test the browser against the Worker and PostGIS reader
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://location_browser:ci@127.0.0.1:5432/ekiti_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE location_browser LOGIN PASSWORD 'ci'; GRANT ekiti_location_reader TO location_browser"
          npm run staging:check
          npx playwright install --with-deps chromium
          npm run test:browser
          npm run test:admin:browser
      - name: Save actual admin desktop/mobile screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-visual-review
          path: test-results/admin-review/
          if-no-files-found: ignore
          retention-days: 3
